name: CFB Betting Data Collector

on:
  schedule:
    # ── Pregame odds snapshots (Tue–Sat) ──────────────────────────
    # Two cron lines to beat the GitHub runner queue in the morning.
    # 14:00 UTC = 10:00 ET  — first attempt, catches morning line moves
    - cron: "0 14 * * 2-6"
    # 20:00 UTC = 4:00 PM ET — afternoon snapshot (captures late moves)
    - cron: "0 20 * * 2-6"

    # ── Postgame results (Sun + Mon) ──────────────────────────────
    # 06:00 UTC = 2:00 AM ET Sun — catches Saturday night finishes
    - cron: "0 6 * * 0"
    # 14:00 UTC = 10:00 AM ET Mon — final cleanup for any delayed scores
    - cron: "0 14 * * 1"

  workflow_dispatch:
    inputs:
      mode:
        description: "Force mode (auto / pregame / postgame)"
        required: false
        default: "auto"
        type: choice
        options: [auto, pregame, postgame]
      week:
        description: "Override CFB week number"
        required: false
        type: number
      year:
        description: "Override season year"
        required: false
        type: number

permissions:
  contents: write          # needed for git push

env:
  CFBD_API_KEY:  ${{ secrets.CFBD_API_KEY }}
  ODDS_API_KEY:  ${{ secrets.ODDS_API_KEY }}
  TZ:            America/New_York

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ─── Checkout ───────────────────────────────────────────────
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ─── Python setup ──────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ─── Run collector ─────────────────────────────────────────
      - name: Collect CFB data
        id: collect
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.mode }}"
            WEEK="${{ github.event.inputs.week }}"
            YEAR="${{ github.event.inputs.year }}"
            [ -n "$MODE" ] && [ "$MODE" != "auto" ] && ARGS="$ARGS --mode $MODE"
            [ -n "$WEEK" ] && ARGS="$ARGS --week $WEEK"
            [ -n "$YEAR" ] && ARGS="$ARGS --year $YEAR"
          fi
          python collect_cfb.py $ARGS

      # ─── Commit & push ─────────────────────────────────────────
      - name: Commit updated data
        if: steps.collect.outputs.collected == 'true'
        run: |
          git config user.name  "cfb-bot"
          git config user.email "cfb-bot@users.noreply.github.com"
          git add data/
          STATS='${{ steps.collect.outputs.stats }}'
          MODE='${{ steps.collect.outputs.mode }}'
          WEEK='${{ steps.collect.outputs.week }}'
          YEAR='${{ steps.collect.outputs.year }}'
          MSG="data: ${MODE} snapshot — ${YEAR} wk${WEEK} [$(date +%Y-%m-%d)]"
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "$MSG"
          # Retry push up to 3 times (handles concurrent runs)
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && break
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done

      # ─── Email notification (skips cleanly if secrets aren't configured) ──
      - name: Send summary email
        if: steps.collect.outputs.collected == 'true' && secrets.EMAIL_TO != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port:    465
          secure:         true
          username:       ${{ secrets.EMAIL_USER }}
          password:       ${{ secrets.EMAIL_APP_PASSWORD }}
          subject: >
            CFB ${{ steps.collect.outputs.mode }} — ${{ steps.collect.outputs.year }}
            Week ${{ steps.collect.outputs.week }}
            [${{ steps.collect.outputs.mode == 'postgame' && '🏈 Results' || '📊 Lines' }}]
          to:             ${{ secrets.EMAIL_TO }}
          from:           CFB Collector <${{ secrets.EMAIL_USER }}>
          body: |
            CFB Betting Data — ${{ steps.collect.outputs.mode }} snapshot
            Season ${{ steps.collect.outputs.year }}, Week ${{ steps.collect.outputs.week }}
            Run at: ${{ github.event.schedule || 'manual' }}

            Stats:
            ${{ steps.collect.outputs.stats }}

            Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # ─── Watchdog: fail if nothing collected all day (Tue–Sat only) ──
  watchdog:
    runs-on: ubuntu-latest
    needs: collect
    # Only fire the watchdog on the LAST scheduled cron of the day (8 PM UTC / 4 PM ET)
    if: github.event.schedule == '0 20 * * 2-6'
    steps:
      - name: Check collection happened
        run: |
          COLLECTED="${{ needs.collect.outputs.collected }}"
          if [ "$COLLECTED" != "true" ]; then
            echo "::error::No data collected today — check API keys and season calendar"
            exit 1
          fi
